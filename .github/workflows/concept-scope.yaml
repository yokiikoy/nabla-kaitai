name: concept-scope

on:
  push:
    paths:
      - "tools/concept-scope/**"
      - "docs/concept-scope/**"
      - ".github/workflows/concept-scope.yaml"
  pull_request:
    paths:
      - "tools/concept-scope/**"
      - "docs/concept-scope/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv
        run: python -m venv tools/concept-scope/.venv

      - name: Install dependencies
        run: tools/concept-scope/.venv/bin/pip install -r tools/concept-scope/requirements.txt

      - name: Run tests
        run: tools/concept-scope/.venv/bin/python -m pytest tools/concept-scope/tests/ -v

      - name: Compile check
        run: python3 -m py_compile tools/concept-scope/check.py

      - name: Run CLI checker
        run: python3 tools/concept-scope/check.py --fail-on-warning
