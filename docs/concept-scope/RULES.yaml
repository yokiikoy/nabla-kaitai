# Machine-readable diagnostic rules for the concept-scope checker/LSP.
#
# This file intentionally starts with regex-based approximations. More precise
# Markdown/TeX parsing can replace individual rules without changing the public
# rule IDs.

version: 0.1
language: ja

severity:
  error: 1
  warning: 2
  information: 3
  hint: 4

usage_level_order:
  mention: 1
  intuition: 2
  definition: 3
  formula: 4
  computation: 5
  theorem_use: 6

rules:
  - id: notation-contract-dx-square
    title: "基底1-formの二乗禁止"
    category: notation_contract
    severity: error
    applies_to: all
    concept_id: dx_as_row_vector
    usage_level: formula
    patterns:
      - "\\bdx\\s*\\^\\s*2\\b"
      - "\\bdy\\s*\\^\\s*2\\b"
      - "\\bdz\\s*\\^\\s*2\\b"
      - "\\bdr\\s*\\^\\s*2\\b"
      - "\\bdtheta\\s*\\^\\s*2\\b"
      - "\\bdphi\\s*\\^\\s*2\\b"
      - "d\\\\theta\\s*\\^\\s*2"
      - "d\\\\phi\\s*\\^\\s*2"
      - "dx²"
      - "dy²"
      - "dz²"
      - "dr²"
    message: "本書では dx, dy, dz などの基底1-formは横ベクトルです。二乗する場合は dx(v)^2 のように作用後のスカラーを二乗してください。"

  - id: notation-contract-sqrt-dx-square
    title: "計量導入前の sqrt(dx^2+dy^2) 型表記禁止"
    category: notation_contract
    severity: error
    chapter_before: 5
    concept_id: metric
    usage_level: formula
    patterns:
      - "\\\\sqrt\\s*\\{[^\\n{}]*d[xyz]\\s*\\^\\s*2[^\\n{}]*\\}"
      - "sqrt\\s*\\([^\\n()]*d[xyz]\\s*\\^\\s*2[^\\n()]*\\)"
    message: "計量導入前に dx^2 型の線素表記を使わないでください。必要なら「成分の二乗和の平方根」として非操作的に述べてください。"

  - id: future-hodge-star-formula
    title: "ホッジ・スター具体式の先出し"
    category: future_concept
    severity: error
    chapter_before: 5
    concept_id: hodge_star
    usage_level: formula
    patterns:
      - "\\\\ast\\s*\\("
      - "\\\\ast\\s*d[xyz]\\b"
      - "\\\\ast\\s*1\\b"
      - "\\*\\s*d[xyz]\\b"
      - "ホッジ・スター.*具体式"
      - "ホッジスター.*具体式"
    allowed_context_patterns:
      - "次章"
      - "後で"
      - "ここでは.*使わない"
      - "具体式.*使わない"
    message: "ホッジ・スターの具体式は第5章で定義します。この章では名前だけの伏線に留めてください。"

  - id: future-hodge-star-computation
    title: "ホッジ・スターを計算に使う"
    category: future_concept
    severity: error
    chapter_before: 5
    concept_id: hodge_star
    usage_level: computation
    patterns:
      - "ホッジ・スターを作用"
      - "ホッジスターを作用"
      - "ホッジ・スターを使"
      - "ホッジスターを使"
      - "\\\\ast\\s*d\\s*\\\\omega"
      - "\\\\ast\\s*d\\s*f"
      - "d\\s*\\\\ast"
    allowed_context_patterns:
      - "次章"
      - "後で"
      - "ここでは.*使わない"
    message: "この章ではホッジ・スターを計算に使えません。第5章以降へ移動してください。"

  - id: integral-dimension-closed-surface
    title: "閉曲面積分に \\oint を使っている"
    category: notation_contract
    severity: warning
    applies_to: all
    concept_id: form_integral
    usage_level: formula
    patterns:
      - "\\\\oint_\\{\\\\partial V\\}"
      - "\\\\oint_\\{\\\\partial\\s*\\\\Omega\\}"
      - "\\\\oint_\\{\\\\partial\\s*\\(.*?\\)\\}"
    message: "閉曲面上の $2$-form 積分には \\iint を使う方針です。\\iint_{\\partial V} を検討してください。"

  - id: over-explain-one-form
    title: "$1$-form の再説明"
    category: over_explanation
    severity: warning
    after_chapter: 2
    concept_id: one_form
    usage_level: definition
    patterns:
      - "\\$?1\\$?-form\\s*とは"
      - "1-form\\s*とは"
      - "ベクトルを1つ食べて.*スカラー"
      - "線の測定器.*とは"
    message: "$1$-form は第1章で定義済みです。この章では短い参照に留める方針です。"

  - id: over-explain-wedge-product
    title: "ウェッジ積の再説明"
    category: over_explanation
    severity: warning
    after_chapter: 2
    concept_id: wedge_product
    usage_level: definition
    patterns:
      - "ウェッジ積\\s*とは"
      - "\\\\wedge\\s*とは"
      - "反対称.*積.*とは"
      - "同じ.*ゼロ.*ウェッジ"
    message: "ウェッジ積は第2章で定義済みです。この章では再定義せず参照に留めてください。"

  - id: over-explain-k-form
    title: "$k$-form の再説明"
    category: over_explanation
    severity: warning
    after_chapter: 2
    concept_id: k_form
    usage_level: definition
    patterns:
      - "\\$?k\\$?-form\\s*とは"
      - "微分形式\\s*とは"
      - "k本のベクトルを食べ"
    message: "$k$-form / 微分形式の基礎は第2章までで導入済みです。必要最小限の復習に留めてください。"

  - id: appendix-array-shorthand
    title: "付録での配列表示省略"
    category: notation_contract
    severity: error
    applies_to: all
    after_heading_pattern: "^##\\s+(付録C|Appendix C)"
    patterns:
      - "\\bE_[xyz]\\b"
      - "E_\\{[xyz]\\}"
    message: "付録では本文用の省略記号 E_x, E_y, E_z を使わず、配列成分を明示してください。"


