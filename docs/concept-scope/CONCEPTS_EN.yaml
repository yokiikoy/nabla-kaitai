# Concept registry for the English version of the concept-scope LSP.
#
# English labels are primary; Japanese equivalents are kept as aliases
# for cross-reference. Stable IDs are shared with the Japanese registry.

version: 0.1
language: en

levels:
  mention: "name only"
  intuition: "intuitive foreshadowing"
  definition: "define"
  formula: "concrete formula"
  computation: "use in calculation"
  theorem_use: "use as theorem"

concepts:
  - id: displacement_vector
    label: "displacement vector"
    kind: object
    introduced_in: ch01
    order: 10
    aliases:
      - "displacement vector"
      - "\\mathbf{v}"
      - "変位ベクトル"
    summary: "An infinitesimal displacement in 3D space represented as a column vector."

  - id: dx_as_row_vector
    label: "dx as row vector"
    kind: notation
    introduced_in: ch01
    order: 10
    aliases:
      - "dx_as_row"
      - "row vector"
      - "横ベクトルとしての dx"
    summary: "The foundational convention of this book: read dx, dy, dz as row vectors acting on displacement vectors."

  - id: one_form
    label: "$1$-form"
    kind: object
    introduced_in: ch01
    order: 10
    aliases:
      - "1-form"
      - "linear functional"
      - "covector"
      - "一次形式"
    summary: "A linear measuring device that eats one vector and returns a scalar."

  - id: differential
    label: "total differential $df$"
    kind: operator
    introduced_in: ch01
    order: 10
    aliases:
      - "df"
      - "total differential"
      - "全微分"
    summary: "The $1$-form that returns the first-order change of a scalar function."

  - id: pullback
    label: "pullback"
    kind: operation
    introduced_in: ch01
    order: 15
    aliases:
      - "pullback"
      - "coordinate change"
      - "引き戻し"
    summary: "The operation of moving a measuring device to parameter-side coordinates via the chain rule."

  - id: wedge_product
    label: "wedge product"
    kind: operation
    introduced_in: ch02
    order: 20
    aliases:
      - "\\wedge"
      - "wedge product"
      - "exterior product"
      - "antisymmetric product"
      - "ウェッジ積"
    summary: "The product that assembles forms into higher-degree antisymmetric measuring devices."

  - id: two_form
    label: "$2$-form"
    kind: object
    introduced_in: ch02
    order: 20
    aliases:
      - "2-form"
      - "area element"
      - "面積計"
    summary: "An antisymmetric bilinear form that eats two vectors and returns an oriented-area-like quantity."

  - id: three_form
    label: "$3$-form"
    kind: object
    introduced_in: ch02
    order: 20
    aliases:
      - "3-form"
      - "volume element"
      - "体積計"
    summary: "An antisymmetric trilinear form that eats three vectors and returns an oriented-volume-like quantity."

  - id: k_form
    label: "$k$-form"
    kind: object
    introduced_in: ch02
    order: 20
    aliases:
      - "k-form"
      - "differential form"
      - "微分形式"
    summary: "An antisymmetric measuring device that eats k vectors and returns a scalar."

  - id: form_integral
    label: "integral of differential forms"
    kind: operation
    introduced_in: ch03
    order: 30
    aliases:
      - "line integral"
      - "surface integral"
      - "volume integral"
      - "線積分"
      - "面積分"
    summary: "The operation of summing the values of a k-form fed k-vectors over a region."

  - id: jacobian
    label: "Jacobian"
    kind: concept
    introduced_in: ch03
    order: 36
    aliases:
      - "Jacobian"
      - "volume scaling factor"
      - "ヤコビアン"
    summary: "The factor by which a small region stretches or shrinks under a coordinate change."

  - id: exterior_derivative
    label: "exterior derivative $d$"
    kind: operator
    introduced_in: ch04
    order: 40
    aliases:
      - "exterior derivative"
      - "d\\omega"
      - "d\\eta"
      - "外微分"
    summary: "The operator that sends a k-form to a (k+1)-form, measuring local discrepancy."

  - id: stokes_theorem
    label: "Stokes' theorem"
    kind: theorem
    introduced_in: ch04
    order: 46
    aliases:
      - "Stokes' theorem"
      - "Stokes"
      - "\\int_{\\partial M}"
      - "ストークスの定理"
    summary: "The theorem linking the integral over a boundary to the integral of the exterior derivative over the interior."

  - id: gauss_theorem
    label: "Gauss's theorem"
    kind: theorem
    introduced_in: ch04
    order: 47
    aliases:
      - "Gauss's theorem"
      - "divergence theorem"
      - "Gauss"
      - "ガウスの定理"
    summary: "The theorem linking the closed-surface integral of a 2-form to the volume integral of a 3-form."

  - id: metric
    label: "metric"
    kind: structure
    introduced_in: ch05
    order: 50
    aliases:
      - "metric"
      - "inner product"
      - "計量"
    summary: "The additional structure that gives length, angle, and orthogonality."

  - id: hodge_star
    label: "Hodge star"
    kind: operator
    introduced_in: ch05
    order: 50
    aliases:
      - "Hodge star"
      - "\\ast"
      - "ホッジ・スター"
    summary: "The operator that pairs a k-form with a (3-k)-form based on metric and orientation."

  - id: nabla_operators
    label: "grad / rot / div"
    kind: dictionary
    introduced_in: ch05
    order: 55
    aliases:
      - "grad"
      - "rot"
      - "curl"
      - "div"
      - "gradient"
      - "rotation"
      - "divergence"
      - "\\nabla"
      - "ナブラ"
    summary: "Vector-calculus operators reinterpreted through exterior derivative and Hodge star."

  - id: unified_stokes
    label: "unified Stokes"
    kind: theorem
    introduced_in: ch07
    order: 70
    aliases:
      - "unified Stokes"
      - "generalized Stokes"
      - "Green's theorem"
      - "大統一ストークス"
    summary: "The unified view of Green's, Stokes', and Gauss's theorems as a single structure."

  - id: maxwell_forms
    label: "Maxwell's equations in differential forms"
    kind: application
    introduced_in: ch09
    order: 90
    aliases:
      - "Maxwell's equations"
      - "dF = 0"
      - "d(\\ast F)"
      - "マクスウェル方程式"
    summary: "The laws of electromagnetism compressed into the language of differential forms."

  - id: manifold_overview
    label: "outlook to manifolds"
    kind: overview
    introduced_in: ch10
    order: 100
    aliases:
      - "manifold"
      - "general relativity"
      - "多様体"
    summary: "The outlook extending the book's framework to curved spaces."

  - id: clifford_dirac
    label: "Clifford algebra and Dirac operator"
    kind: overview
    introduced_in: ch11
    order: 110
    aliases:
      - "Clifford algebra"
      - "Pauli matrices"
      - "Dirac operator"
      - "true nabla"
      - "クリフォード代数"
    summary: "The path beyond differential forms to the true nabla through mixing forms of different degrees."
