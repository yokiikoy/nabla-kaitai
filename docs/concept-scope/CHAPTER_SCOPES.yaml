        max_level: mention
    recap_policy:
      maxwell_forms:
        max_level: mention
        max_lines: 5

  - id: ch11
    path: manuscript/ja/ch11/ch11.md
    title: "真のナブラ"
    chapter: 11
    order: 110
    assumes:
      - exterior_derivative
      - hodge_star
      - nabla_operators
      - maxwell_forms
      - manifold_overview
    introduces:
      clifford_dirac:
        from: intuition
        to: formula
    previews: {}
    recap_policy:
