# Chapter-level concept scope for the concept-scope LSP.
#
# The `order` field is the pedagogical order. The DAG checks dependency
# consistency, but future/past judgments use this order.

version: 0.1
language: ja

defaults:
  future_concept_policy:
    mention: info
    intuition: info
    definition: error
    formula: error
    computation: error
    theorem_use: error
  known_concept_recap_policy:
    max_level: mention
    max_lines: 3
    severity: warning

chapters:
  - id: ch01
    path: manuscript/ja/ch01/ch01.md
    title: "微分と積分の記号を「行列」で解体する"
    chapter: 1
    order: 10
    assumes: []
    introduces:
      displacement_vector:
        from: definition
        to: computation
      dx_as_row_vector:
        from: definition
        to: computation
      one_form:
        from: intuition
        to: computation
      differential:
        from: definition
        to: computation
      pullback:
        from: intuition
        to: formula
    previews:
      wedge_product:
        max_level: intuition
      k_form:
        max_level: intuition
      two_form:
        max_level: intuition
      three_form:
        max_level: intuition
      form_integral:
        max_level: intuition
      stokes_theorem:
        max_level: intuition
      metric:
        max_level: intuition
      exterior_derivative:
        max_level: intuition
      hodge_star:
        max_level: intuition
      nabla_operators:
        max_level: intuition
      maxwell_forms:
        max_level: intuition
    recap_policy: {}

  - id: ch02
    path: manuscript/ja/ch02/ch02.md
    title: "代数としての面積・体積"
    chapter: 2
    order: 20
    assumes:
      - displacement_vector
      - dx_as_row_vector
      - one_form
      - differential
    introduces:
      wedge_product:
        from: definition
        to: computation
      two_form:
        from: definition
        to: computation
      three_form:
        from: definition
        to: computation
      k_form:
        from: intuition
        to: formula
    previews:
      form_integral:
        max_level: intuition
      metric:
        max_level: intuition
        note: "長さ・角度への直感的言及は許可するが、計量構造としては導入しない。"
      exterior_derivative:
        max_level: intuition
      jacobian:
        max_level: intuition
    recap_policy:
      dx_as_row_vector:
        max_level: mention
        max_lines: 5
      one_form:
        max_level: mention
        max_lines: 5

  - id: ch03
    path: manuscript/ja/ch03/ch03.md
    title: "積分の再構築"
    chapter: 3
    order: 30
    assumes:
      - displacement_vector
      - dx_as_row_vector
      - one_form
      - wedge_product
      - two_form
      - three_form
      - k_form
      - pullback
    introduces:
      form_integral:
        from: definition
        to: computation
      jacobian:
        from: definition
        to: computation
    previews:
      exterior_derivative:
        max_level: intuition
      stokes_theorem:
        max_level: intuition
      metric:
        max_level: intuition
      nabla_operators:
        max_level: intuition
    recap_policy:
      one_form:
        max_level: mention
        max_lines: 3
      wedge_product:
        max_level: mention
        max_lines: 3
      two_form:
        max_level: mention
        max_lines: 3
      three_form:
        max_level: mention
        max_lines: 3

  - id: ch04
    path: manuscript/ja/ch04/ch04.md
    title: "外微分 d"
    chapter: 4
    order: 40
    assumes:
      - one_form
      - two_form
      - three_form
      - k_form
      - wedge_product
      - form_integral
      - pullback
      - jacobian
    introduces:
      exterior_derivative:
        from: intuition
        to: computation
      stokes_theorem:
        from: intuition
        to: formula
      gauss_theorem:
        from: intuition
        to: formula
    previews:
      hodge_star:
        max_level: intuition
        note: "第5章で定義する辞書としてのみ扱う。具体式や計算は禁止。"
        allowed_context_patterns:
          - "次章"
          - "後で"
          - "ここでは.*使わない"
          - "具体式.*使わない"
          - "第5章"
          - "後述"
      metric:
        max_level: intuition
        note: "長さ・大きさを取り出す追加規則としての伏線のみ許可。"
      nabla_operators:
        max_level: intuition
        note: "既習者への補助線に留める。grad/rot/div の公式化は禁止。"
        allowed_context_patterns:
          - "既習者"
          - "見覚え"
          - "後の章"
          - "後で整理"
          - "名前だけ"
      maxwell_forms:
        max_level: intuition
        note: "物理法則の局所化の模式的説明のみ許可。形式記法の詳細は禁止。"
    recap_policy:
      one_form:
        max_level: mention
        max_lines: 3
      two_form:
        max_level: mention
        max_lines: 3
      three_form:
        max_level: mention
        max_lines: 3
      wedge_product:
        max_level: mention
        max_lines: 3
      form_integral:
        max_level: mention
        max_lines: 4

  - id: ch05
    path: manuscript/ja/ch05/ch05.md
    title: "ホッジ・スター"
    chapter: 5
    order: 50
    assumes:
      - one_form
      - two_form
      - three_form
      - wedge_product
      - exterior_derivative
      - stokes_theorem
      - gauss_theorem
    introduces:
      metric:
        from: definition
        to: computation
      hodge_star:
        from: definition
        to: computation
      nabla_operators:
        from: intuition
        to: formula
    previews:
      unified_stokes:
        max_level: mention
      maxwell_forms:
        max_level: intuition
    recap_policy:
      exterior_derivative:
        max_level: mention
        max_lines: 4
      wedge_product:
        max_level: mention
        max_lines: 3

  - id: ch06
    path: manuscript/ja/ch06/ch06.md
    title: "ナブラの解体"
    chapter: 6
    order: 60
    assumes:
      - exterior_derivative
      - metric
      - hodge_star
      - nabla_operators
    introduces: {}
    previews:
      unified_stokes:
        max_level: mention
    recap_policy:
      hodge_star:
        max_level: mention
        max_lines: 4
      exterior_derivative:
        max_level: mention
        max_lines: 4

  - id: ch07
    path: manuscript/ja/ch07/ch07.md
    title: "統一されたストークスの定理"
    chapter: 7
    order: 70
    assumes:
      - exterior_derivative
      - stokes_theorem
      - gauss_theorem
      - hodge_star
      - nabla_operators
    introduces:
      unified_stokes:
        from: definition
        to: theorem_use
    previews:
      maxwell_forms:
        max_level: mention
      manifold_overview:
        max_level: intuition
    recap_policy:
      exterior_derivative:
        max_level: mention
        max_lines: 3
      hodge_star:
        max_level: mention
        max_lines: 3

  - id: ch08
    path: manuscript/ja/ch08/ch08.md
    title: "公式のショートカットと曲線座標"
    chapter: 8
    order: 80
    assumes:
      - pullback
      - jacobian
      - exterior_derivative
      - hodge_star
      - nabla_operators
      - unified_stokes
    introduces: {}
    previews:
      maxwell_forms:
        max_level: mention
    recap_policy:
      pullback:
        max_level: mention
        max_lines: 3
      jacobian:
        max_level: mention
        max_lines: 3

  - id: ch09
    path: manuscript/ja/ch09/ch09.md
    title: "マクスウェル方程式への展望"
    chapter: 9
    order: 90
    assumes:
      - exterior_derivative
      - hodge_star
      - unified_stokes
      - nabla_operators
    introduces:
      maxwell_forms:
        from: intuition
        to: formula
    previews:
      manifold_overview:
        max_level: intuition
    recap_policy:
      hodge_star:
        max_level: mention
        max_lines: 4

  - id: ch10
    path: manuscript/ja/ch10/ch10.md
    title: "計量・多様体への展望"
    chapter: 10
    order: 100
    assumes:
      - exterior_derivative
      - hodge_star
      - maxwell_forms
    introduces:
      manifold_overview:
        from: intuition
        to: formula
    previews:
